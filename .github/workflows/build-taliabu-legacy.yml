name: Build Taliabu TV3 Legacy

on:
  push:
    branches:
      - taliabu-legacy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout customized source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Python build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install lxml ujson pyquery==2.0.2 requests jsonpath cachetools pycryptodome beautifulsoup4

      - name: Prepare portable build
        shell: bash
        run: |
          : > local.properties
          sed -i '/buildPython.*python.exe/d' pyramid/build.gradle
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi

      - name: Configure stable release signing
        shell: bash
        run: |
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          signingConfigs="$(echo "$signingConfigs" | base64 -d)"
          signingConfig="$(echo "$signingConfig" | base64 -d)"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          cp .github/workflows/TVBoxOSC.jks app/TaliabuTV3.jks
          cat >> gradle.properties <<EOF
          RELEASE_STORE_FILE=./TaliabuTV3.jks
          RELEASE_KEY_ALIAS=TVBoxOSC
          RELEASE_STORE_PASSWORD=TVBoxOSC
          RELEASE_KEY_PASSWORD=TVBoxOSC
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all release variants
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --no-daemon --warning-mode all

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' dist/ ';'
          test -n "$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Taliabu-TV3-Legacy
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
